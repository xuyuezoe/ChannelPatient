# DDXPlus pain intensity is inflated for every condition (GERD 42% severe); severity rows are [M]-adjusted.
# Numbers only need the right direction (MASTER_PLAN: rankings robust to ±80% noise). Each row sums to 1;
# bool tagged slots give P(true). Missing entries -> uniform.
