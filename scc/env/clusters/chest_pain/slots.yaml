  reask: {en: ["Where exactly is the pain?", "Can you show me the spot where it hurts?"], zh: ["具体疼在哪里？", "你指一下疼的地方。"]}
  default_disclosure: on_general_ask
  display:
    en: {retrosternal: "right behind the breastbone", epigastric: "just above the stomach, below the chest", precordial: "over the left side of the chest, near the heart", lateral_chest: "on the side of the chest"}
    zh: {retrosternal: "胸骨后面正中间", epigastric: "胃上面一点，胸口下面", precordial: "左胸口，心脏那边", lateral_chest: "胸的侧面"}
  choice: {en: {retrosternal: "behind the breastbone", epigastric: "just above the stomach", precordial: "over the left side of the chest", lateral_chest: "on the side of the chest"}, zh: {retrosternal: "胸骨后面", epigastric: "胃上面", precordial: "左胸口", lateral_chest: "胸的侧面"}}
  ddxplus: {evidence: E_55, map: {V_29: epigastric, V_197: epigastric, V_101: retrosternal, V_159: precordial, V_160: precordial, V_55: lateral_chest, V_56: lateral_chest}}
quality:
