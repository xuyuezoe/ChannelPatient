# Slot definitions. Every atom.slot must be a key here. `tag_options` lists allowed atom.tags for tagged slots.
# keywords: used by KeywordClassifier (stub). display: value -> patient-facing words. ddxplus: mapping hints for build_cases.
chief_complaint:
  type: bool
  keywords: {en: [what brings, problem, wrong, bother, help you, "how can i help"], zh: [哪里不舒服, 怎么了, 什么问题, 哪儿不舒服, 怎么不舒服]}
